# Puerto dinámico del servidor (Render define la variable PORT)
server.port=${PORT:8080}

# Conexión dinámicas a PostgreSQL mediante variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:dpg-db8rugon74is73ck1a50-a.oregon-postgres.render.com}:${DB_PORT:5432}/${DB_NAME:clinica_db_gt3g}?sslmode=require
spring.datasource.username=${DB_USER:clinica_db_gt3g_user}
spring.datasource.password=${DB_PASSWORD}

# Configuración de JPA / Hibernate
# Usamos 'none' para asegurar que JPA no realice cambios automáticos en las tablas
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Configuración de CORS dinámico para permitir peticiones desde el frontend
cors.allowed-origins=${FRONTEND_URL:*}
debug=true