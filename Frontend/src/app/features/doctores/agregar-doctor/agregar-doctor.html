<div class="container" style="max-width: 800px;">
  
  <div class="header">
    <div>
      <h2 style="margin: 0; color: #0f172a;">Registrar Nuevo Doctor</h2>
      <span style="color: #64748b; font-size: 0.9rem;">Ingresa los datos personales y asigna el centro médico.</span>
    </div>
  </div>

  <div class="form-card">
    <form [formGroup]="doctorForm" (ngSubmit)="guardarDoctor()">
      
      <div class="form-grid">
        <div class="form-group">
          <label>Nombres <span>*</span></label>
          <input type="text" formControlName="nombres">
        </div>

        <div class="form-group">
          <label>Apellidos <span>*</span></label>
          <input type="text" formControlName="apellidos">
        </div>

        <div class="form-group">
          <label>Especialidad <span>*</span></label>
          <input type="text" formControlName="especialidad">
        </div>

        <div class="form-group">
          <label>No. Colegiado <span>*</span></label>
          <input type="text" formControlName="colegiado">
        </div>

        <div class="form-group">
          <label>Teléfono <span>*</span></label>
          <input type="text" formControlName="telefono">
        </div>

        <div class="form-group full-width">
          <label>Hospital Asignado <span>*</span></label>
          <select formControlName="hospitalId">
            <option value="" disabled selected>Seleccione un hospital...</option>
            @for (h of hospitales; track h.id) {
              <option [value]="h.id">{{ h.nombre }}</option>
            }
          </select>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" routerLink="/doctores" class="btn-cancel">Cancelar</button>
        <button type="submit" [disabled]="cargando || doctorForm.invalid" class="btn-submit">
          {{ cargando ? 'Procesando...' : 'Guardar Registro' }}
        </button>
      </div>

    </form>
  </div>
</div>
