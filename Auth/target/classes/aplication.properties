server.port=8081

# Conexión a la BD independiente de Seguridad
spring.datasource.url=jdbc:postgresql://postgres:5432/auth_db
spring.datasource.username=admin
spring.datasource.password=secretpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Rutas de las llaves RSA
jwt.private-key-path=classpath:keys/private_key.pem
jwt.public-key-path=classpath:keys/public_key.pem
jwt.expiration-ms=86400000

server.port=8080
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration