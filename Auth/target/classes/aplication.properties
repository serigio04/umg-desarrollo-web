# Puerto dinámico asignado por Render (o 8081 en local)
server.port=${PORT:8081}

# Conexión dinámica a la Base de Datos unificada en Render
spring.datasource.url=jdbc:postgresql://${DB_HOST:dpg-db8rugon74is73ck1a50-a.oregon-postgres.render.com}:${DB_PORT:5432}/${DB_NAME:clinica_db_gt3g}?sslmode=require
spring.datasource.username=${DB_USER:clinica_db_gt3g_user}
spring.datasource.password=${DB_PASSWORD}

# Configuración de JPA / Hibernate (usa 'validate' porque las tablas ya fueron creadas por script)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de JWT y llaves RSA
jwt.private-key-path=classpath:keys/private_key.pem
jwt.public-key-path=classpath:keys/public_key.pem
jwt.expiration-ms=86400000

# Permitir CORS dinámico para el Frontend
cors.allowed-origins=${FRONTEND_URL:*}

# Exclusión de autoconfiguración por defecto de Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration